<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车机音频转换器 v3.2</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #F5F5F7;
            --card-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --border-radius: 12px;
            --success-color: #34C759;
            --error-color: #FF3B30;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0;
        }

        .drop-zone {
            border: 2px dashed #D1D1D6;
            border-radius: var(--border-radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
            margin-bottom: 20px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary-color);
            background-color: rgba(0, 122, 255, 0.05);
        }

        .drop-zone-icon { font-size: 32px; margin-bottom: 10px; display: block; }
        .drop-zone-text { color: var(--text-sub); font-size: 14px; }

        input[type="file"] { display: none; }

        .file-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            max-height: 400px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: #F9F9F9;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .file-icon { margin-right: 12px; font-size: 18px; }
        .file-info { flex-grow: 1; overflow: hidden; }
        .file-name {
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .file-meta { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

        .file-status {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #eee;
            color: var(--text-sub);
        }

        .file-status.converting { background-color: rgba(0, 122, 255, 0.1); color: var(--primary-color); }
        .file-status.done { background-color: rgba(52, 199, 89, 0.1); color: var(--success-color); }
        .file-status.error { background-color: rgba(255, 59, 48, 0.1); color: var(--error-color); }

        /* 高级设置样式 */
        .settings-wrapper {
            margin-bottom: 15px;
            text-align: center;
        }

        .settings-toggle {
            font-size: 12px;
            color: var(--text-sub);
            cursor: pointer;
            user-select: none;
        }

        .settings-panel {
            display: none; /* 默认折叠 */
            margin-top: 10px;
            padding: 10px;
            background: #F9F9F9;
            border-radius: 8px;
            justify-content: center;
            gap: 10px;
        }

        .settings-panel.show {
            display: flex;
        }

        .rate-btn {
            padding: 6px 12px;
            border: 1px solid #D1D1D6;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .rate-btn:hover {
            border-color: var(--primary-color);
        }

        .rate-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(0,122,255,0.05);
            font-weight: 600;
        }

        .btn-download {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-download:disabled { background-color: #D1D1D6; cursor: not-allowed; }
        .btn-download:not(:disabled):hover { background-color: #0066D6; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>车机音频转换器</h1>
        <p class="subtitle">专为老款车机优化的离线转换工具</p>
    </header>

    <div class="drop-zone" id="dropZone">
        <span class="drop-zone-icon">🎵</span>
        <p class="drop-zone-text">拖拽音频文件至此<br>或点击选择</p>
        <input type="file" id="fileInput" multiple accept=".flac,.wav,.mp3,.m4a,.ogg">
    </div>

    <div class="file-list" id="fileList"></div>

    <!-- C. 新增高级设置 UI -->
    <div class="settings-wrapper">
        <div class="settings-toggle" id="settingsToggle">高级设置 ▼</div>
        <div class="settings-panel" id="settingsPanel">
            <button class="rate-btn active" data-rate="320">320 kbps</button>
            <button class="rate-btn" data-rate="256">256 kbps</button>
            <button class="rate-btn" data-rate="192">192 kbps</button>
            <button class="rate-btn" data-rate="128">128 kbps</button>
        </div>
    </div>

    <button class="btn-download" id="downloadBtn" disabled>
        下载全部 (MP3 320kbps)
    </button>
</div>

<script>
/**
 * v3.2 核心逻辑
 * 更新：增加码率选择，增加转换前参数快照
 */

const Utils = {
    formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    },
    getFileName(filename) {
        return filename.replace(/\.[^/.]+$/, "");
    }
};

const Decoder = {
    audioContext: null,

    initContext() {
        if (!this.audioContext) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.audioContext = new AudioContext({ sampleRate: 44100 });
        }
        if (this.audioContext.state === 'suspended') {
            this.audioContext.resume();
        }
        return this.audioContext;
    },

    async decode(arrayBuffer) {
        const ctx = this.initContext();
        let audioBuffer;
        
        try {
            audioBuffer = await ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.error("解码失败:", e);
            throw new Error("不支持的格式或文件损坏");
        }

        // 强制 44.1kHz 重采样
        if (audioBuffer.sampleRate !== 44100) {
            console.log(`检测到采样率 ${audioBuffer.sampleRate}Hz，正在重采样至 44.1kHz...`);
            return await this.resample(audioBuffer, 44100);
        }
        
        return audioBuffer;
    },

    async resample(audioBuffer, targetRate) {
        const channels = audioBuffer.numberOfChannels;
        const duration = audioBuffer.duration;
        const offlineCtx = new OfflineAudioContext(channels, 
            Math.ceil(targetRate * duration), 
            targetRate);
        
        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineCtx.destination);
        source.start(0);
        
        return await offlineCtx.startRendering();
    }
};

/**
 * Encoder 模块更新
 * 接受 bitRate 参数，不再写死
 */
const Encoder = {
    config: {
        sampleRate: 44100,
        channels: 2
    },

    // 修改：增加 bitRate 参数
    async encode(audioBuffer, bitRate = 320) {
        if (typeof lamejs === 'undefined') {
            throw new Error("编码库未加载");
        }

        const sampleRate = this.config.sampleRate;
        // 使用传入的 bitRate
        const mp3encoder = new lamejs.Mp3Encoder(this.config.channels, sampleRate, bitRate);
        const mp3Data = [];

        const left = audioBuffer.getChannelData(0);
        const right = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : left;

        const samples = left.length;
        const leftInt = new Int16Array(samples);
        const rightInt = new Int16Array(samples);

        for (let i = 0; i < samples; i++) {
            const sLeft = Math.max(-1, Math.min(1, left[i]));
            const sRight = Math.max(-1, Math.min(1, right[i]));
            leftInt[i] = sLeft < 0 ? sLeft * 0x8000 : sLeft * 0x7FFF;
            rightInt[i] = sRight < 0 ? sRight * 0x8000 : sRight * 0x7FFF;
        }

        const block = 1152;
        for (let i = 0; i < samples; i += block) {
            const leftChunk = leftInt.subarray(i, i + block);
            const rightChunk = rightInt.subarray(i, i + block);
            const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
            if (mp3buf.length > 0) mp3Data.push(mp3buf);
        }
        
        const mp3buf = mp3encoder.flush();
        if (mp3buf.length > 0) mp3Data.push(mp3buf);

        return new Blob(mp3Data, { type: 'audio/mpeg' });
    }
};

const App = {
    files: [],
    isProcessing: false,
    currentBitRate: 320, // 默认码率

    init() {
        this.dropZone = document.getElementById('dropZone');
        this.fileInput = document.getElementById('fileInput');
        this.fileList = document.getElementById('fileList');
        this.downloadBtn = document.getElementById('downloadBtn');
        
        // 初始化高级设置控件
        this.settingsToggle = document.getElementById('settingsToggle');
        this.settingsPanel = document.getElementById('settingsPanel');
        this.rateButtons = document.querySelectorAll('.rate-btn');

        this.bindEvents();
    },

    bindEvents() {
        // 文件交互
        this.dropZone.addEventListener('click', () => this.fileInput.click());
        this.fileInput.addEventListener('change', (e) => this.handleFiles(e.target.files));
        this.dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            this.dropZone.classList.add('dragover');
        });
        this.dropZone.addEventListener('dragleave', () => this.dropZone.classList.remove('dragover'));
        this.dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            this.dropZone.classList.remove('dragover');
            this.handleFiles(e.dataTransfer.files);
        });

        this.downloadBtn.addEventListener('click', () => this.downloadAll());

        // C. 码率选择交互
        this.settingsToggle.addEventListener('click', () => {
            this.settingsPanel.classList.toggle('show');
            const icon = this.settingsToggle.textContent.includes('▼') ? '▲' : '▼';
            this.settingsToggle.textContent = `高级设置 ${icon}`;
        });

        this.rateButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // 防止处理过程中切换导致混乱，简单禁用处理中的切换逻辑（可选）
                // 这里为了体验，允许切换，但只会影响下一次任务
                this.rateButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.currentBitRate = parseInt(e.target.dataset.rate);
                this.updateUIState(); // 更新按钮文字
            });
        });
    },

    handleFiles(filesList) {
        if (this.isProcessing) return;
        
        const allowedExt = ['flac', 'wav', 'mp3', 'm4a', 'ogg'];
        const validFiles = Array.from(filesList).filter(f => {
            const ext = f.name.split('.').pop().toLowerCase();
            return allowedExt.includes(ext);
        });

        if (validFiles.length === 0) return;

        validFiles.forEach(file => {
            const id = Date.now() + Math.random();
            this.files.push({
                id: id,
                file: file,
                status: '等待',
                blob: null
            });
            this.renderFileItem(id, file, '等待');
        });

        this.updateUIState();
        this.startProcessing();
    },

    renderFileItem(id, file, status) {
        let itemEl = document.querySelector(`[data-id="${id}"]`);
        
        if (!itemEl) {
            itemEl = document.createElement('div');
            itemEl.className = 'file-item';
            itemEl.dataset.id = id;
            itemEl.innerHTML = `
                <div class="file-icon">🎵</div>
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-meta">${Utils.formatFileSize(file.size)}</span>
                </div>
                <span class="file-status">${status}</span>
            `;
            this.fileList.appendChild(itemEl);
        } else {
            itemEl.querySelector('.file-status').textContent = status;
            itemEl.querySelector('.file-status').className = `file-status ${status === '完成' ? 'done' : (status === '错误' ? 'error' : 'converting')}`;
            
            if (status === '完成') {
                itemEl.querySelector('.file-name').textContent = Utils.getFileName(file.name) + '.mp3';
            }
        }
    },

    async startProcessing() {
        if (this.isProcessing) return;
        this.isProcessing = true;
        
        // 关键：在处理开始时“快照”当前的码率设置
        // 这样在长任务过程中用户点击其他码率，不会影响当前正在进行的编码
        const targetBitRate = this.currentBitRate;
        
        this.updateUIState(); // 更新按钮为禁用状态

        for (let i = 0; i < this.files.length; i++) {
            const item = this.files[i];
            if (item.status === '完成' || item.status === '错误') continue;

            item.status = '转换中';
            this.renderFileItem(item.id, item.file, '转换中');

            try {
                const arrayBuffer = await item.file.arrayBuffer();
                const audioBuffer = await Decoder.decode(arrayBuffer);
                
                // 使用快照的码率进行编码
                const mp3Blob = await Encoder.encode(audioBuffer, targetBitRate);
                
                item.blob = mp3Blob;
                item.status = '完成';
                this.renderFileItem(item.id, item.file, '完成');

            } catch (e) {
                console.error(e);
                item.status = '错误';
                this.renderFileItem(item.id, item.file, '错误');
            }
        }

        this.isProcessing = false;
        this.updateUIState();
    },

    updateUIState() {
        const completedCount = this.files.filter(f => f.status === '完成').length;
        const totalCount = this.files.length;
        const rateText = `MP3 ${this.currentBitRate}kbps`;

        if (totalCount > 0 && completedCount === totalCount) {
            this.downloadBtn.textContent = `下载全部 (${completedCount} 个文件)`;
            this.downloadBtn.disabled = false;
        } else if (totalCount > 0 && this.isProcessing) {
            this.downloadBtn.textContent = `正在转换...`;
            this.downloadBtn.disabled = true;
        } else {
            this.downloadBtn.textContent = `下载全部 (${rateText})`;
            this.downloadBtn.disabled = true;
        }
    },

    async downloadAll() {
        const completedFiles = this.files.filter(f => f.status === '完成' && f.blob);
        const count = completedFiles.length;
        if (count === 0) return;

        this.downloadBtn.textContent = "正在打包...";
        this.downloadBtn.disabled = true;

        const zip = new JSZip();
        completedFiles.forEach(item => {
            const filename = Utils.getFileName(item.file.name) + '.mp3';
            zip.file(filename, item.blob);
        });
        
        const content = await zip.generateAsync({ type: 'blob' });
        saveAs(content, "车机音乐_" + new Date().toLocaleDateString() + ".zip");

        this.updateUIState();
    }
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v3.0 开发测试环境</title>
    <!-- 引入 lamejs (生产环境会打包，开发阶段直接用 CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        .test-zone { background: white; padding: 20px; border-radius: 8px; }
        button { padding: 10px 20px; cursor: pointer; }
        #log { margin-top: 10px; font-family: monospace; background: #333; color: #0f0; padding: 10px; height: 200px; overflow-y: auto;}
    </style>
</head>
<body>

    <div class="test-zone">
        <h1>v3.0 核心引擎测试</h1>
        <p>选择 FLAC/WAV/MP3 文件进行测试：</p>
        <input type="file" id="fileInput" accept=".flac,.wav,.mp3,.m4a">
        <button id="convertBtn">转换并下载 MP3 (320kbps)</button>
        <div id="log"></div>
    </div>

    <!-- 模块加载 (ES6 Modules) -->
    <script type="module">
        import Decoder from './src/decoder.js';
        import Encoder from './src/encoder.js';
        import { formatFileSize } from './src/util.js';

        const log = (msg) => {
            document.getElementById('log').innerHTML += `<div>> ${msg}</div>`;
        };

        const decoder = new Decoder();
        const encoder = new Encoder();

        document.getElementById('convertBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) return alert("请先选择文件");

            const file = fileInput.files[0];
            log(`开始处理: ${file.name} (${formatFileSize(file.size)})`);

            try {
                // 1. 读取文件
                const arrayBuffer = await file.arrayBuffer();
                log('文件读取完成...');

                // 2. 解码
                log('正在解码...');
                const startTime = performance.now();
                const audioBuffer = await decoder.decode(arrayBuffer);
                const duration = (performance.now() - startTime).toFixed(0);
                log(`解码完成 (耗时 ${duration}ms), 采样率: ${audioBuffer.sampleRate}Hz`);

                // 3. 编码为 MP3
                log('正在编码 MP3 (320kbps)...');
                const mp3Blob = await encoder.encode(audioBuffer);
                log(`编码完成，大小: ${formatFileSize(mp3Blob.size)}`);

                // 4. 下载
                const url = URL.createObjectURL(mp3Blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name.replace(/\.[^/.]+$/, "") + ".mp3";
                a.click();
                log('下载已触发！');

            } catch (err) {
                log(`<span style="color:red">错误: ${err.message}</span>`);
            }
        });
    </script>
</body>
</html>
